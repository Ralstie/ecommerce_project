<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E-Commerce Marketplace</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="{% url 'home' %}"
        >
            E-Commerce Marketplace
        </a>


        <div class="d-flex align-items-center gap-2">

            <a
                href="{% url 'home' %}"
                class="btn btn-outline-light"
            >
                Home
            </a>


            {% if user.is_authenticated %}

                <span class="text-white me-2">

                    Welcome,
                    {{ user.username }}

                </span>


                <a
                    href="{% url 'product_list' %}"
                    class="btn btn-outline-light"
                >
                    Products
                </a>


                <a
                    href="{% url 'cart' %}"
                    class="btn btn-warning"
                >
                    Cart
                </a>


                {% if user.userprofile.role == 'VENDOR' %}

                    <a
                        href="{% url 'vendor_dashboard' %}"
                        class="btn btn-info"
                    >
                        Vendor Dashboard
                    </a>

                {% endif %}

                <form
                    method="POST"
                    action="{% url 'logout' %}"
                    class="d-inline"
                >

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Logout
                    </button>

                </form>


            {% else %}


                <a
                    href="{% url 'login' %}"
                    class="btn btn-outline-light"
                >
                    Login
                </a>


                <a
                    href="{% url 'register' %}"
                    class="btn btn-primary"
                >
                    Register
                </a>


            {% endif %}

        </div>

    </div>

</nav>

<main class="container mt-4">

    {% block content %}

    {% endblock %}

</main>

<footer class="bg-dark text-white text-center p-3 mt-5">

    <p class="mb-0">
        E-Commerce Marketplace
    </p>

</footer>


</body>

</html>
