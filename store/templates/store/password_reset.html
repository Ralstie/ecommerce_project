{% extends 'store/base.html' %}

{% block content %}

<h1>Forgot Password?</h1>

<p>
    Enter your email address and we will send you
    a password reset link.
</p>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button
        type="submit"
        class="btn btn-primary">
        Send Reset Email
    </button>

</form>

{% endblock %}
