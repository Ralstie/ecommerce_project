{% extends 'store/base.html' %}

{% block content %}

<h1>Delete Store</h1>

<p>
    Are you sure you want to delete
    <strong>{{ store.name }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button
        type="submit"
        class="btn btn-danger">
        Yes, Delete Store
    </button>

    <a
        href="{% url 'vendor_dashboard' %}"
        class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
