{% extends 'store/base.html' %}


{% block content %}


<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-8">


            <div class="card shadow">


                <div class="card-body">


                    <h1 class="mb-4">

                        Add Product

                    </h1>


                    <p class="text-muted">

                        Adding product to:
                        <strong>{{ store.name }}</strong>

                    </p>


                    <form
                        method="POST"
                        enctype="multipart/form-data"
                    >

                        {% csrf_token %}


                        {{ form.as_p }}


                        <div class="mt-3">


                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                Add Product
                            </button>


                            <a
                                href="{% url 'vendor_products' store.id %}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>


                        </div>


                    </form>


                </div>


            </div>


        </div>

    </div>

</div>


{% endblock %}
